<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
</head>

<body>

  <!-- Botón Hamburguesa -->
  <button id="profile-toggle" class="profile-toggle">
    <i class="fas fa-user"></i> Perfil
  </button>

  <!-- Menú lateral del perfil -->
  <aside id="profile-menu" class="profile-menu">
    <div class="profile-menu-header">
      <h3>Perfil de Usuario</h3>
      <button id="close-profile" class="close-profile">&times;</button>
    </div>

    <div id="profile-info" class="profile-info">
<div id="profile-data" class="profile-data"></div>
    </div>

    <div class="profile-menu-footer">
      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- Capa de fondo -->
  <div id="overlay" class="overlay"></div>

  <!-- Contenido principal del perfil -->
  <main class="profile-container">
    <h2>Perfil de Usuario</h2>
    <div id="profile-data" class="profile-data"></div>
    <div id="tester-sessions"></div>
    <div id="profile-actions"></div>
    <div id="sessions-container" class="sessions-container"></div>
    <div id="message"></div>
  </main>

  <!--busqueda de usuarios-->
  <div class="search-users-section">
  <input type="text" id="search-users-input" placeholder="Buscar usuario o estación...">
  <button onclick="searchUsers()">Buscar</button>
</div>
<div id="search-users-results"></div>

  <!-- Scripts -->
   <script src="/CommandGenerator/epic-cmd-gen-command-generator.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/testerManagement.js"></script>

  <script>
    // Simula el modo desarrollo (evita login)

    // === Sidebar functionality ===
    const profileToggle = document.getElementById("profile-toggle");
    const profileMenu = document.getElementById("profile-menu");
    const closeProfile = document.getElementById("close-profile");
    const overlay = document.getElementById("overlay");

    profileToggle.addEventListener("click", () => {
      profileMenu.classList.add("open");
      overlay.classList.add("active");
    });

    closeProfile.addEventListener("click", () => {
      profileMenu.classList.remove("open");
      overlay.classList.remove("active");
    });

    overlay.addEventListener("click", () => {
      profileMenu.classList.remove("open");
      overlay.classList.remove("active");
    });

    // Cerrar sesión
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "../index.html";
    }
  </script>
</body>
</html>
