<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Usuario</title>
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="main-header">
    <div class="header-left">
      <h1>Panel de Usuario</h1>
    </div>

    <div class="header-center">
      <input
        type="text"
        id="searchInput"
        class="search-bar"
        placeholder="Buscar testers o sesiones..."
      />
    </div>

    <div class="header-right">
      <div class="user-info" id="user-info">
        <span id="user-name" class="user-name"></span>
      </div>
      <button onclick="logout()" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="dashboard">
      <!-- LEFT COLUMN (PROFILE + SESSIONS LIST) -->
      <section class="left-column">
        <!-- Profile Container -->
        <div class="profile-container">
          <h2>Mi Perfil</h2>

          <!-- Profile Data -->
          <div id="profile-data" class="profile-data">
            <div class="loading">
              <i class="fas fa-spinner fa-spin"></i> Cargando perfil...
            </div>
          </div>

          <!-- Profile Actions -->
          <div id="profile-actions" class="profile-actions"></div>
        </div>

        <!-- Sessions List (solo para KeyTesters) -->
        <div id="sessions-list-container" class="sessions-list-container" style="display: none;">
          <h3><i class="fas fa-gamepad"></i> Mis Sesiones</h3>
          <div id="sessions-list" class="sessions-list">
            <div class="loading">
              <i class="fas fa-spinner fa-spin"></i> Cargando sesiones...
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT PANEL (DYNAMIC CONTENT) -->
      <aside id="dynamic-panel" class="side-panel">
        <div class="panel-header">
          <h3 id="panel-title">Detalles</h3>
          <button id="close-panel" class="close-panel" style="display: none;">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div id="dynamic-content" class="dynamic-content">
          <div class="empty-state">
            <i class="fas fa-hand-pointer"></i>
            <p>Selecciona una sesión para ver los detalles</p>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- JS -->
  <script src="/CommandGenerator/epic-cmd-gen-command-generator.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
