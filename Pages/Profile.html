<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Usuario</title>
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="main-header">
    <div class="header-left">
      <h1>Panel de Usuario</h1>
    </div>

    <div class="header-center">
      <input
        type="text"
        id="searchInput"
        class="search-bar"
        placeholder="Buscar testers o sesiones..."
      />
    </div>

    <div class="header-right">
      <div class="user-info">
        <span id="user-name" class="user-name">Cargando...</span>
        <span id="user-role" class="user-role">---</span>
      </div>
      <button onclick="logout()" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <section class="dashboard">
      <div class="profile-container">
        <h2>Mi Perfil</h2>

        <!-- Información del perfil -->
        <div id="profile-data" class="profile-data">
          <div class="loading">
            <i class="fas fa-spinner fa-spin"></i> Cargando perfil...
          </div>
        </div>

        <!-- ✅ CONTENEDOR VACÍO - Los botones se agregan dinámicamente según el rol -->
        <div id="profile-actions" class="profile-actions">
          <!-- Los botones se cargarán aquí según el rol del usuario -->
        </div>

        <!-- Sesiones del tester (si aplica) -->
        <div id="tester-sessions"></div>
      </div>

      <!-- PANEL DERECHO DINÁMICO -->
      <aside id="dynamic-panel" class="side-panel hidden">
        <div class="panel-header">
          <h3 id="panel-title">Detalles</h3>
          <button id="close-panel" class="close-panel">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div id="dynamic-content" class="dynamic-content"></div>
      </aside>
    </section>
  </main>

  <!-- JS - ORDEN IMPORTANTE -->
  <script src="/CommandGenerator/epic-cmd-gen-command-generator.js"></script>
  <script src="../js/profile.js"></script>
  
  <!-- Solo cargar si existe -->
  <script>
    // Cargar testerManagement.js solo si existe
    const script = document.createElement('script');
    script.src = '../js/testerManagement.js';
    script.onerror = () => console.warn('⚠️ testerManagement.js no encontrado (opcional)');
    document.body.appendChild(script);
  </script>
</body>
</html>
