<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Usuario</title>
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="main-header">
    <div class="header-left">
      <h1>Panel de Usuario</h1>
    </div>

    <div class="header-center">
      <input
        type="text"
        id="searchInput"
        class="search-bar"
        placeholder="Buscar testers o sesiones..."
      />
    </div>

    <div class="header-right">
      <div class="user-info">
        <span id="user-name" class="user-name">Cargando...</span>
        <span id="user-role" class="user-role">---</span>
      </div>
      <button id="logoutBtn" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <!-- CONTENEDOR PRINCIPAL -->
    <section class="dashboard">
      <div class="profile-container">
        <h2>Mi Perfil</h2>

        <div id="profile-data" class="profile-data"></div>

        <div id="profile-actions" class="profile-actions">
          <button id="create-session-btn" class="action-btn create-btn">
            <i class="fas fa-plus-circle"></i> Crear Sesión
          </button>
          <button id="view-sessions-btn" class="action-btn view-btn">
            <i class="fas fa-list"></i> Ver Sesiones
          </button>
          <button id="view-testers-btn" class="action-btn view-btn">
            <i class="fas fa-users"></i> Ver Testers
          </button>
        </div>

        <div id="tester-sessions"></div>
      </div>

      <!-- PANEL DERECHO DINÁMICO -->
      <aside id="dynamic-panel" class="side-panel hidden">
        <div class="panel-header">
          <h3 id="panel-title">Detalles</h3>
          <button id="close-panel" class="close-panel"><i class="fas fa-times"></i></button>
        </div>
        <div id="dynamic-content" class="dynamic-content"></div>
      </aside>
    </section>
  </main>

  <!-- JS -->
  <script src="/CommandGenerator/epic-cmd-gen-command-generator.js"></script>
  <script src="/js/profile.js"></script>
  <script src="../js/testerManagement.js"></script>
</body>
</html>
