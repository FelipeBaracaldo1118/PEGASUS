<!DOCTYPE html>
<html>
<head>
    <title>Recuperar con PIN</title>
    <style>
        .pin-input { width: 50px; height: 50px; font-size: 24px; 
                     text-align: center; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ingresa el código enviado a tu teléfono</h2>
        <div id="pinInputs">
            <input type="text" maxlength="1" class="pin-input" id="pin1">
            <input type="text" maxlength="1" class="pin-input" id="pin2">
            <input type="text" maxlength="1" class="pin-input" id="pin3">
            <input type="text" maxlength="1" class="pin-input" id="pin4">
            <input type="text" maxlength="1" class="pin-input" id="pin5">
            <input type="text" maxlength="1" class="pin-input" id="pin6">
        </div>
        <button onclick="verifyPIN()">Verificar</button>
        <p id="timer">Tiempo restante: 10:00</p>
    </div>

    <script>
        // Auto-focus en siguiente input
        document.querySelectorAll('.pin-input').forEach((input, index, inputs) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Timer countdown
        let timeLeft = 600; // 10 minutos
        const timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `Tiempo restante: ${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('El código ha expirado');
            }
        }, 1000);

        async function verifyPIN() {
            const pin = Array.from(document.querySelectorAll('.pin-input'))
                .map(input => input.value)
                .join('');
            
            if (pin.length !== 6) {
                alert('Ingresa el código completo');
                return;
            }

            try {
                const response = await fetch('/api/auth/verify-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: sessionStorage.getItem('resetEmail'),
                        pin 
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    sessionStorage.setItem('resetToken', data.token);
                    window.location.href = '/reset-password';
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('Error al verificar código');
            }
        }
    </script>
</body>
</html>
