<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Testers a Sesión</title>
    <link rel="stylesheet" href="./css/asignarSession.css">
</head>
<body>
    <div class="container">
        <h2>Asignar Testers a Sesión</h2>
        <!-- BOTÓN VOLVER ATRÁS -->
        <button class="btn" onclick="window.location.href='pages/profile.html'">⬅ Volver al Perfil</button>
        
        <div class="session-info" id="session-info"></div>
        
        <button class="btn" id="assignBtn">Asignar testers automáticamente</button>
        
        <div class="assigned-list" id="assigned-list"></div>
        
        <div id="message"></div>
    </div>

    <script>
        const SERVER_URL = "http://10.13.46.195:3000";
        const token = localStorage.getItem("token");
        let sessionCaptureRequirements = {};

        // Obtener sessionId de la URL
        function getSessionId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("sessionId");
        }

        // Mostrar info de la sesión
        async function fetchSessionInfo() {
            const sessionId = getSessionId();
            if (!sessionId) return;

            const res = await fetch(`${SERVER_URL}/api/sessions/${sessionId}`, {
                headers: { "Authorization": token }
            });
            const session = await res.json();

            if (!res.ok) {
                document.getElementById("session-info").innerText = session.message || "No se pudo cargar la sesión";
                return;
            }

            let html = `<b>Backend:</b> ${session.backendName}<br>`;
            html += `<b>IdOverride:</b> ${session.idOverride}<br>`;
            html += `<b>Cantidad de jugadores:</b> ${session.totalPlayers}<br>`;
            html += `<b>CL:</b> ${session.buildString}<br>`;
            document.getElementById("session-info").innerHTML = html;

            sessionCaptureRequirements = session.captureRequirements || {};

            if (session.assignedTesters && session.assignedTesters.length > 0) {
                renderAssignedList(session.assignedTesters);
            }
        }

        document.getElementById("assignBtn").addEventListener("click", async function () {
            const sessionId = getSessionId();
            if (!sessionId) return;

            document.getElementById("message").innerText = "Asignando testers...";

            const res = await fetch(`${SERVER_URL}/api/sessions/${sessionId}/assign`, {
                method: "POST",
                headers: { "Authorization": token }
            });
            const data = await res.json();

            if (res.ok) {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText = "Testers asignados correctamente.";
                renderAssignedList(data.assignedTesters);
            } else {
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText = data.message || "Error en la asignación";
            }
        });

        // ⬇️ AQUÍ ESTÁ LA FUNCIÓN MEJORADA - REEMPLAZA LA QUE TENÍAS ⬇️
        function renderAssignedList(list) {
            if (!list || list.length === 0) {
                document.getElementById("assigned-list").innerHTML = "<i>No hay testers asignados aún.</i>";
                return;
            }
            
            let html = `
                <h3>Testers asignados (${list.length})</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Tester</th>
                            <th>Device</th>
                            <th>Región</th>
                            <th>MMR</th>
                            <th>Pod</th>
                            <th>Estación</th>
                            <th>Captura asignada</th>
                            <th>Grupo</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            list.forEach(t => {
                html += `
                    <tr>
                        <td><strong>${t.Epam_user || t.testerId}</strong></td>
                        <td>${t.device}</td>
                        <td>${t.region}</td>
                        <td>${t.mmr}</td>
                        <td>${t.pod}</td>
                        <td>${t.station}</td>
                        <td>${Array.isArray(t.capturas) ? t.capturas.join(", ") : ""}</td>
                        <td>${t.group ? `<span class="group-badge">${t.group}</span>` : ""}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            document.getElementById("assigned-list").innerHTML = html;
        }

        fetchSessionInfo();
    </script>
</body>
</html>
