<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crear Sesión de Juego</title>
    <link rel="stylesheet" href="./css/keyTesterSession.css">
</head>

<body>
    <div class="container">
        <h2>Crear Sesión de Juego</h2>
        <form id="sessionForm">
            <label for="commsLead">Comms Lead:</label>
            <input type="text" id="commsLead" required placeholder="@Francisco Casademont">

            <label for="commsAssist">Comms Assist:</label>
            <input type="text" id="commsAssist" required placeholder="@Lucas Battistini">

            <label for="backendName">Backend Name:</label>
            <input type="text" id="backendName" required placeholder="Baseball">

            <label for="buildString">Build String:</label>
            <input type="text" id="buildString" required placeholder="++Fortnite+Release-38.10-CL-47160256">

            <label for="mode">Modo de Juego:</label>
            <select id="mode" required>
                <option value="">Selecciona un modo</option>
                <option value="100">Battle Royale - 100 jugadores</option>
                <option value="80">Battle Royale - 80 jugadores</option>
                <option value="sprout">Sprout</option>
            </select>

            <label for="googleDrive">Google Drive:</label>
            <input type="url" id="googleDrive" required placeholder="https://drive.google.com/drive/folders/...">

            <label for="gameModes">Game Modes / Playlists:</label>
            <textarea id="gameModes" required placeholder="BR: Squads / Reload (Dashberry) / Blitz"></textarea>

            <div id="normal-id">
                <label for="idOverride">ID Override:</label>
                <input type="text" id="idOverride" required placeholder="42069">
            </div>

            <div id="sprout-ids" style="display:none;">
                <label for="idOverrideA">ID Override Grupo 1:</label>
                <input type="text" id="idOverrideA" placeholder="ID para Grupo 1">
                <label for="idOverrideB">ID Override Grupo 2:</label>
                <input type="text" id="idOverrideB" placeholder="ID para Grupo 2">
            </div>



            <label for="startTime">Start Time:</label>
            <input type="text" id="startTime" required placeholder="1PM">

            <label for="premadeTeams">Premade Teams:</label>
            <input type="text" id="premadeTeams" required placeholder="No">

            <label for="teamSize">Team Size:</label>
            <input type="text" id="teamSize" required placeholder="Squ
ad (4), Fill">

            <label for="testPlan">Test Plan / BTR:</label>
            <input type="url" id="testPlan" required placeholder="https://jira.it.epicgames.com/browse/FNTEST-202139">



            <label for="totalPlayers">Cantidad de jugadores:</label>
            <input type="number" id="totalPlayers" min="1" required placeholder="100 o 80">

            <!-- NUEVA SECCIÓN: Requerimientos de Captura -->
            <h3>Requerimientos de Captura</h3>
            <table>
                <tr>
                    <th>Tipo de Captura</th>
                    <th>PS4</th>
                    <th>PS4 Dev</th>
                    <th>PS5</th>
                    <th>PS5 Dev</th>
                    <th>PC</th>
                    <th>Android</th>
                    <th>iOS</th>
                    <th>XSX</th>
                    <th>Switch</th>
                </tr>
                <tr>
                    <td>CSVProfile</td>
                    <td><input type="number" min="0" id="csv_ps4"></td>
                    <td><input type="number" min="0" id="csv_ps4dev"></td>
                    <td><input type="number" min="0" id="csv_ps5"></td>
                    <td><input type="number" min="0" id="csv_ps5dev"></td>
                    <td><input type="number" min="0" id="csv_pc"></td>
                    <td><input type="number" min="0" id="csv_android"></td>
                    <td><input type="number" min="0" id="csv_ios"></td>
                    <td><input type="number" min="0" id="csv_xsx"></td>
                    <td><input type="number" min="0" id="csv_switch"></td>
                </tr>
                <tr>
                    <td>LLM</td>
                    <td></td>
                    <td><input type="number" min="0" id="llm_ps4dev"></td>
                    <td></td>
                    <td><input type="number" min="0" id="llm_ps5dev"></td>
                    <td><input type="number" min="0" id="llm_pc"></td>
                    <td><input type="number" min="0" id="llm_android"></td>
                    <td></td>
                    <td><input type="number" min="0" id="llm_xsx"></td>
                    <td><input type="number" min="0" id="llm_switch"></td> <!-- Nueva celda -->
                </tr>
                <tr>
                    <td>LWM</td>
                    <td></td>
                    <td><input type="number" min="0" id="lwm_ps4dev"></td>
                    <td></td>
                    <td><input type="number" min="0" id="lwm_ps5dev"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td><input type="number" min="0" id="lwm_xsx"></td>
                    <td><input type="number" min="0" id="lwm_switch"></td> <!-- Nueva celda -->
                </tr>
                <tr>
                    <td>Trace</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td><input type="number" min="0" id="trace_pc"></td>
                    <td><input type="number" min="0" id="trace_android"></td>
                    <td><input type="number" min="0" id="trace_ios"></td>
                    <td></td>
                    <td><input type="number" min="0" id="trace_switch"></td> <!-- Nueva celda -->
                </tr>
                <tr>
                    <td>Razor</td>
                    <td></td>
                    <td><input type="number" min="0" id="razor_ps4dev"></td>
                    <td></td>
                    <td><input type="number" min="0" id="razor_ps5dev"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td><input type="number" min="0" id="razor_xsx"></td>
                    <td></td>
                </tr>
                <tr>
                    <td>DX11</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td><input type="number" min="0" id="dx11_pc"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>DX12</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td><input type="number" min="0" id="dx12_pc"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>Performance</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td><input type="number" min="0" id="perf_pc"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>

            <button type="submit">Crear Sesión</button>
        </form>
        <div id="message"></div>
    </div>

    <script src="../js/keyTesterSession.js"></script>
</body>

</html>
